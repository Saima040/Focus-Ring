<style>
/* Layout: sticker-style toy box. Title row with a cartoon ring mascot, a theme switch and a speaker button, a chunky browser window holding the fake page and the pink ring, a par meter, a goal note, then big colourful keycaps. Light is sunny yellow, dark is a grape night. */
:root {
  --bg: #ffd23f;
  --ink: #2b1b4a;
  --fg: #2b1b4a;
  --on: #2b1b4a;
  --paper: #ffffff;
  --paper-dim: rgba(255, 255, 255, 0.5);
  --dot: rgba(43, 27, 74, 0.12);
  --tshadow: #ffffff;
  --pink: #ff3d8b;
  --mint: #2fd9a6;
  --sky: #4ab8ff;
  --orange: #ff9a4d;
  --grape: #7b5cff;
  --lime: #b8ea4f;
  --amber: #ffb400;
  --good: #11a577;
  --link: #5a3fe0;
  --violet: #7b5cff;
  --warm: #c76a00;
  --sw-off: #e4def5;
  --danger-a: #ffe0e6;
  --danger-b: #ffb9c8;
  --veil: rgba(43, 27, 74, 0.62);
  --scrim: rgba(43, 27, 74, 0.55);
  --faint: rgba(43, 27, 74, 0.35);
  --star-off: rgba(43, 27, 74, 0.12);
  --track: #7fd0ff;
  --lv-bar: #ff8fc2;
  --lv-tint-l: #ffe3f0;
  --page-bg: #ffe3f0;
  --font-display: 'Bagel Fat One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --font-ui: 'Nunito', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1030;
    --ink: #b4a3ef;
    --fg: #f6f0ff;
    --paper: #2e2054;
    --paper-dim: rgba(46, 32, 84, 0.55);
    --dot: rgba(255, 255, 255, 0.06);
    --tshadow: #0c0618;
    --link: #bdaeff;
    --violet: #bdaeff;
    --warm: #ffc15e;
    --good: #3be3b0;
    --sw-off: #4b3b82;
    --danger-a: #5a2342;
    --danger-b: #7a2f57;
    --veil: rgba(8, 4, 20, 0.74);
    --scrim: rgba(8, 4, 20, 0.66);
    --faint: rgba(180, 163, 239, 0.55);
    --star-off: rgba(255, 255, 255, 0.16);
    --track: #3a2a78;
    --page-bg: #2a1a3e;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .browser { --page-bg: color-mix(in srgb, var(--lv-bar) 15%, #150c29); }
}
:root[data-theme="dark"] {
  --bg: #1a1030;
  --ink: #b4a3ef;
  --fg: #f6f0ff;
  --paper: #2e2054;
  --paper-dim: rgba(46, 32, 84, 0.55);
  --dot: rgba(255, 255, 255, 0.06);
  --tshadow: #0c0618;
  --link: #bdaeff;
  --violet: #bdaeff;
  --warm: #ffc15e;
  --good: #3be3b0;
  --sw-off: #4b3b82;
  --danger-a: #5a2342;
  --danger-b: #7a2f57;
  --veil: rgba(8, 4, 20, 0.74);
  --scrim: rgba(8, 4, 20, 0.66);
  --faint: rgba(180, 163, 239, 0.55);
  --star-off: rgba(255, 255, 255, 0.16);
  --track: #3a2a78;
  --page-bg: #2a1a3e;
  color-scheme: dark;
}
:root[data-theme="dark"] .browser { --page-bg: color-mix(in srgb, var(--lv-bar) 15%, #150c29); }
.browser { --page-bg: var(--lv-tint-l); }
html { background: var(--bg); }
body {
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 2px, transparent 2.6px);
  background-size: 24px 24px;
  color: var(--fg);
  font-family: var(--font-ui);
  font-weight: 600;
  padding-inline: 16px;
  padding-block: 16px 32px;
  display: flex;
  justify-content: center;
  transition: background-color 0.25s, color 0.25s;
}
.wrap { width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 54px; height: 54px; flex: none; display: block; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2.3rem; line-height: 1; margin: 0; letter-spacing: 0.01em; color: var(--fg); text-shadow: 3px 3px 0 var(--tshadow); }
.tag { margin: 4px 0 0; font-size: 0.85rem; font-weight: 800; }
.hdr { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mini { font-family: var(--font-ui); font-weight: 800; font-size: 0.78rem; color: var(--fg); background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.mini:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.themebtn, .mousebtn { position: relative; flex: none; padding: 0; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); cursor: pointer; color: var(--fg); }
.themebtn:active, .mousebtn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.themebtn { width: 70px; height: 38px; border-radius: 999px; background: var(--track); overflow: hidden; transition: background 0.3s; }
.themebtn .deco { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
.themebtn .cloud { opacity: 1; }
.themebtn .stars { opacity: 0; transform: translateY(6px); }
.themebtn[aria-checked="true"] .cloud { opacity: 0; transform: translateY(-6px); }
.themebtn[aria-checked="true"] .stars { opacity: 1; transform: none; }
.themebtn .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; transition: left 0.3s cubic-bezier(0.3, 1.5, 0.5, 1), rotate 0.3s; }
.themebtn[aria-checked="true"] .knob { left: 35px; rotate: 360deg; }
.themebtn .knob svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity 0.2s; }
.themebtn .moon, .themebtn[aria-checked="true"] .sun { opacity: 0; }
.themebtn[aria-checked="true"] .moon { opacity: 1; }
.mousebtn { width: 58px; height: 42px; border-radius: 16px; display: grid; place-items: center; }
.mousebtn svg { width: 54px; height: 38px; display: block; overflow: visible; }
.mousebtn .on { display: none; }
.mousebtn[aria-pressed="true"] .on { display: inline; }
.mousebtn[aria-pressed="true"] .off { display: none; }
.mousebtn .waves { animation: waves 1.1s ease-in-out infinite; }
@keyframes waves { 50% { opacity: 0.45; } }
.themebtn:focus-visible, .mousebtn:focus-visible, .mini:focus-visible, .wcard:focus-visible, .lcard:focus-visible, .go:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

[hidden] { display: none !important; }
main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pill { font-weight: 800; font-size: 0.78rem; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 5px 12px; box-shadow: 0 3px 0 var(--ink); }
.hello { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px 20px; flex-wrap: wrap; }
.hello p { margin: 0; flex: 1 1 280px; line-height: 1.5; font-size: 0.95rem; }
.hello .go { margin: 0; }
.grid { display: grid; gap: 14px; }
.grid.worlds { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.grid.levels { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.wcard, .lcard { position: relative; font-family: var(--font-ui); color: var(--fg); text-align: left; background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 4px 5px 0 var(--ink); padding: 0; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; min-height: 112px; min-width: 0; }
.wcard:not([disabled]):hover, .lcard:not([disabled]):hover { transform: translateY(-2px); }
.wcard:not([disabled]):active, .lcard:not([disabled]):active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.wcard .band, .lcard .band { background: var(--c, #ff8fc2); color: var(--on); border-bottom: 3px solid var(--ink); padding: 6px 12px 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.wcard .wn, .lcard .ln { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; }
.wcard .wr, .lcard .lr { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; }
.wcard .body, .lcard .body { padding: 9px 12px 11px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.wcard .wt, .lcard .lt { font-weight: 800; font-size: 1rem; line-height: 1.2; }
.wcard .ws, .lcard .ls { margin-top: auto; font-size: 0.8rem; font-weight: 800; color: var(--warm); letter-spacing: 0.04em; }
.wcard .bar2 { height: 8px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper); overflow: hidden; }
.wcard .bar2 i { display: block; height: 100%; background: var(--mint); }
.wcard.cur { animation: curpulse 1.6s ease-in-out infinite; }
@keyframes curpulse { 50% { box-shadow: 4px 5px 0 var(--ink), 0 0 0 4px var(--pink); } }
.wcard[disabled], .lcard[disabled] { opacity: 0.5; border-style: dashed; box-shadow: none; cursor: not-allowed; background: var(--paper-dim); }
.wcard[disabled] .band, .lcard[disabled] .band { background: transparent; color: var(--fg); }
.lock { font-size: 0.78rem; font-weight: 800; opacity: 0.8; }
.whead h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1; margin: 0; text-shadow: 3px 3px 0 var(--tshadow); }
.whead p { margin: 6px 0 0; font-weight: 800; }
.crumb { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 800; font-size: 0.95rem; }
#lname b { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; }
.wrap[data-screen="play"] .tag { display: none; }
.wrap[data-screen="play"] h1 { font-size: 1.7rem; }
.wrap[data-screen="play"] .logo { width: 44px; height: 44px; }
.dock { margin-top: 22px; height: 64px; border: 3px dashed var(--faint); border-radius: 18px; display: flex; align-items: center; padding: 0 14px 0 84px; font-size: 0.8rem; font-weight: 800; opacity: 0.85; }
.meta { display: flex; justify-content: space-between; gap: 4px 16px; flex-wrap: wrap; font-size: 0.95rem; font-weight: 800; }
.meta .n { font-variant-numeric: tabular-nums; }
.meta b { font-weight: 800; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 0 7px; }
.meter { position: relative; height: 16px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; margin-top: -6px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--mint); transition: width 0.22s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.2s; }
.meter.meh i { background: var(--orange); }
.meter.bad i { background: var(--pink); }
.meter u { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ink); }

.browser { position: relative; border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; background: var(--paper); box-shadow: 6px 6px 0 var(--ink); }
.browser.shake { animation: shake 0.42s; }
@keyframes shake { 20% { transform: translateX(-9px) rotate(-0.4deg); } 40% { transform: translateX(8px) rotate(0.4deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
.bar { display: flex; align-items: center; gap: 12px; padding: 9px 12px; background: var(--lv-bar); color: var(--on); border-bottom: 3px solid var(--ink); transition: background 0.3s; }
.dots { display: flex; gap: 6px; flex: none; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--on); display: block; }
.url { flex: 1; min-width: 0; background: var(--paper); color: var(--fg); border: 2px solid var(--ink); border-radius: 999px; padding: 3px 14px; font-size: 0.78rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page { position: relative; background: var(--page-bg); color: var(--fg); padding: 28px 16px 20px; min-height: 380px; overflow: hidden; transition: background 0.3s; }
.status { display: flex; justify-content: space-between; gap: 4px 16px; flex-wrap: wrap; padding: 9px 14px; border-top: 3px solid var(--ink); background: var(--paper); font-size: 0.85rem; font-weight: 800; min-height: 2.8em; }
.status .f { min-width: 0; }
.status .m { color: var(--violet); min-width: 0; }

.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h2 { margin: 0; font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
.sec p { margin: 0; font-size: 0.92rem; line-height: 1.5; font-weight: 600; opacity: 0.8; }
.sec .row { padding-top: 12px; }
.sec.nav .row, .sec.footer .row { padding-top: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 16px; }
.sec.nav { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 12px 14px; margin-bottom: 16px; box-shadow: 3px 3px 0 var(--ink); }
.sec.skipbar { min-height: 30px; margin-bottom: 4px; justify-content: center; }
.sec.main { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 16px 18px 20px; gap: 10px; box-shadow: 4px 4px 0 var(--ink); }
.sec.main + .sec.main { margin-top: 14px; }
.sec.footer { margin-top: 18px; padding-top: 12px; border-top: 3px dashed var(--faint); }
.sec.footer .el { font-size: 13px; }
.sec.float { position: absolute; right: 14px; bottom: 14px; z-index: 2; }
.sec.float .el.button { background: var(--pink); color: #fff; border-radius: 999px; }
.scrim { position: absolute; inset: 0; z-index: 3; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 14px; }
.sec.modal { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 18px; max-width: 400px; width: 100%; box-shadow: 5px 5px 0 var(--ink); gap: 12px; }
.sec.modal .row { flex-direction: column; align-items: flex-start; gap: 18px; }

.el { display: inline-flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; line-height: 1.2; padding: 8px 14px; border-radius: 12px; user-select: none; cursor: default; min-width: 0; }
.el.link { color: var(--link); text-decoration: underline wavy var(--link); text-decoration-thickness: 1.5px; text-underline-offset: 4px; padding: 6px 8px; }
.el.button { background: var(--paper); color: var(--fg); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.el.button.primary { background: var(--mint); color: var(--on); }
.el.button.danger { background: repeating-linear-gradient(45deg, var(--danger-a), var(--danger-a) 7px, var(--danger-b) 7px, var(--danger-b) 14px); }
.el.button.on { background: #ffe66b; color: var(--on); }
.el.check, .el.toggle { padding: 6px 8px; }
.box { width: 24px; height: 24px; border: 3px solid var(--ink); border-radius: 8px; display: inline-grid; place-items: center; font-style: normal; font-size: 15px; line-height: 1; color: var(--on); flex: none; background: var(--paper); }
.el.check.on .box { background: var(--mint); }
.sw { width: 44px; height: 26px; border: 3px solid var(--ink); border-radius: 14px; background: var(--sw-off); position: relative; display: inline-block; flex: none; transition: background 0.15s; }
.sw b { position: absolute; top: 1px; left: 1px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2.5px solid var(--on); box-sizing: border-box; transition: left 0.16s cubic-bezier(0.3, 1.6, 0.5, 1); }
.el.toggle.on .sw { background: var(--mint); }
.el.toggle.on .sw b { left: 19px; }
.el .sub { font-style: normal; font-weight: 800; font-size: 13px; background: var(--lv-tint-l); color: var(--on); border: 2px solid var(--ink); border-radius: 8px; padding: 1px 8px; letter-spacing: 1px; }
.el.acc::before { content: '▸'; }
.el.acc.on::before { content: '▾'; }
.el.tab { border-radius: 12px 12px 0 0; box-shadow: none; border-bottom-width: 3px; }
.el.tab.on { background: #ffe66b; color: var(--on); }
.el.combo { min-width: 230px; justify-content: space-between; }
.el.opt { padding: 5px 14px; border-width: 2px; box-shadow: none; min-width: 150px; }
.el.opt.on { background: var(--sky); color: var(--on); }
.el.slider { width: 100%; max-width: 420px; justify-content: space-between; gap: 12px; }
.el.slider .sub { letter-spacing: 0; font-size: 12px; white-space: nowrap; }
.el.disabled { opacity: 0.45; filter: grayscale(0.7); }
.el.sr:not(.focused) { opacity: 0; }

/* the ring: a jelly tube with googly eyes and a tiny grin */
#ring { position: absolute; left: 0; top: 0; z-index: 6; box-sizing: border-box; border: 5px solid var(--pink); border-radius: 16px; box-shadow: 0 0 0 2px #2b1b4a, 0 0 0 4px #fff, inset 0 0 0 2.5px #2b1b4a, 0 0 22px 5px rgba(255, 61, 139, 0.5); pointer-events: none; transition: transform 0.28s cubic-bezier(0.34, 1.5, 0.5, 1), width 0.24s cubic-bezier(0.34, 1.4, 0.5, 1), height 0.24s cubic-bezier(0.34, 1.4, 0.5, 1), border-radius 0.2s, opacity 0.12s; }
#ring::before { content: ''; position: absolute; right: 14px; top: -4.5px; width: 18px; height: 3.5px; border-radius: 4px; background: rgba(255, 255, 255, 0.85); }
#ring.idle { border-radius: 50%; animation: bob 1.8s ease-in-out infinite; }
#ring.bump { animation: bump 0.4s; }
#ring.off { opacity: 0; }
@keyframes bob { 50% { translate: 0 -5px; } }
@keyframes bump { 0% { scale: 1; rotate: 0deg; } 30% { scale: 1.14 0.88; rotate: -2deg; } 62% { scale: 0.96 1.07; rotate: 1.5deg; } 100% { scale: 1; rotate: 0deg; } }
.eyes { position: absolute; left: 9px; top: -17px; display: flex; gap: 2px; transition: left 0.2s, top 0.2s, transform 0.2s; }
.eyes i { width: 16px; height: 19px; background: #fff; border: 2.5px solid #2b1b4a; border-radius: 50%; display: grid; place-items: center; animation: blink 4.6s infinite; position: relative; }
.eyes b { width: 7px; height: 8px; background: #2b1b4a; border-radius: 50%; transform: translate(var(--px, 0), var(--py, 0)); transition: transform 0.15s; position: relative; }
.eyes b::after { content: ''; position: absolute; left: 1.2px; top: 1px; width: 2.5px; height: 2.5px; border-radius: 50%; background: #fff; }
.mouth { position: absolute; left: 50%; bottom: -10px; width: 26px; height: 13px; translate: -50% 0; transition: bottom 0.2s, width 0.2s, height 0.2s; overflow: visible; }
#ring.idle .eyes { left: 50%; top: 8px; transform: translateX(-50%); }
#ring.idle .mouth { bottom: 6px; width: 20px; height: 10px; }
#ring.idle::before { right: 9px; }
@keyframes blink { 0%, 93%, 100% { scale: 1 1; } 96% { scale: 1 0.1; } }

.veil { position: absolute; inset: 0; z-index: 10; background: var(--veil); display: flex; align-items: center; justify-content: center; padding: 18px; }
.veil[hidden] { display: none; }
.card { background: var(--paper); color: var(--fg); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 24px 22px 26px; max-width: 480px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; animation: drop 0.4s cubic-bezier(0.3, 1.5, 0.5, 1); }
@keyframes drop { from { transform: translateY(-36px) scale(0.9); opacity: 0; } }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 8vw, 3rem); margin: 0; line-height: 1; color: var(--violet); text-wrap: balance; }
.veil.good h2 { color: var(--good); }
.veil.bad h2 { color: var(--pink); }
.card p { margin: 0; max-width: 42ch; line-height: 1.5; font-size: 0.95rem; font-weight: 600; }
.card p.sub { font-size: 0.82rem; opacity: 0.75; }
.card p.stars { font-size: 2.6rem; line-height: 1; display: flex; gap: 6px; }
.stars span { display: inline-block; color: var(--amber); -webkit-text-stroke: 2px var(--on); animation: pop 0.5s both; animation-delay: calc(var(--i) * 0.16s + 0.2s); }
.stars span.off { color: var(--star-off); }

.info .h b { background: var(--mint); color: var(--on); }
.keys { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; padding-bottom: 5px; }
.key { font-family: var(--font-ui); font-weight: 800; font-size: 0.95rem; color: var(--on); border: 3px solid var(--ink); border-radius: 15px; padding: 14px 4px; cursor: pointer; min-width: 0; box-shadow: 0 5px 0 var(--ink); transition: transform 0.06s, box-shadow 0.06s; }
.key[data-k="S"], .key[data-k="T"] { background: var(--sky); }
.key[data-k="L"], .key[data-k="R"] { background: var(--lime); }
.key[data-k="P"] { background: var(--orange); }

<script>
// <engine>
const KEYS = ['T', 'S', 'E', 'P', 'L', 'R', 'X'];
const clone = (o) => JSON.parse(JSON.stringify(o));
const visible = (lvl, s, id) => !(lvl.els[id].hidden && lvl.els[id].hidden(s));
const disabled = (lvl, s, id) => !!(lvl.els[id].disabled && lvl.els[id].disabled(s));
const gm = (lvl, s, g) => { const m = lvl.groups[g]; return typeof m === 'function' ? m(s) : m; };
function groupOf(lvl, s, id) {
  const gs = lvl.groups || {};
  for (const g in gs) if (gm(lvl, s, g).includes(id)) return g;
  return null;
}
function stops(lvl, s) {
  let ids = lvl.order(s).map((o) => (typeof o === 'string' ? o : s.rov[o.group]));
  ids = ids.filter((id) => visible(lvl, s, id) && !disabled(lvl, s, id));
  const trap = lvl.trap ? lvl.trap(s) : null;
  if (trap) ids = ids.filter((id) => trap.includes(id));
  return ids;
}
function newGame(lvl) {
  const s = lvl.init();
  s.rov = s.rov || {};
  const gs = lvl.groups || {};
  for (const g in gs) if (!s.rov[g]) s.rov[g] = gm(lvl, s, g)[0];
  return { s, focus: lvl.start || null, k: 0, won: false, failed: null, msg: '' };
}
function step(lvl, st0, key) {
  if (st0.won || st0.failed) return st0;
  const st = clone(st0);
  const s = st.s;
  const prev = st.focus;
  st.k += 1;
  st.msg = '';
  const g = {
    win() { st.won = true; },
    fail(m) { st.failed = m; },
    focus(id) { st.focus = id; },
    say(m) { st.msg = m; }
  };
  const fix = () => {
    if (st.focus && (!visible(lvl, s, st.focus) || disabled(lvl, s, st.focus))) st.focus = null;
  };
  if (lvl.rev && lvl.rev(s) && (key === 'T' || key === 'S')) key = key === 'T' ? 'S' : 'T';
  if (lvl.dead && lvl.dead.includes(key)) {
    g.say('That key is broken on this page.');
  } else if (key === 'T' || key === 'S') {
    const list = stops(lvl, s);
    if (list.length) {
      const i = list.indexOf(st.focus);
      if (i < 0) st.focus = key === 'T' ? list[0] : list[list.length - 1];
      else st.focus = list[(i + (key === 'T' ? 1 : -1) + list.length) % list.length];
    }
  } else if (key === 'E' || key === 'P') {
    const id = st.focus;
    if (id) {
      const e = lvl.els[id];
      let ok;
      if (e.kind === 'link') ok = key === 'E';
      else if (e.kind === 'button') ok = true;
      else ok = key === 'P';
      if (ok) { if (e.act) e.act(s, g); }
      else if (e.kind === 'link') g.say('Space does not follow a link. Try Enter.');
      else g.say('Enter does not work on a ' + ({ check: 'checkbox', toggle: 'switch', radio: 'radio button' })[e.kind] + '. Try Space.');
    }
  } else if (key === 'L' || key === 'R') {
    const gname = st.focus && groupOf(lvl, s, st.focus);
    if (gname) {
      const handled = lvl.onArrow ? lvl.onArrow(s, key, st.focus, g) === true : false;
      if (!handled) {
        const members = gm(lvl, s, gname).filter((id) => visible(lvl, s, id) && !disabled(lvl, s, id));
        const i = members.indexOf(st.focus);
        if (i >= 0 && members.length > 1) {
          const n = members[(i + (key === 'R' ? 1 : -1) + members.length) % members.length];
          st.focus = n;
          s.rov[gname] = n;
        }
      }
    }
  } else if (key === 'X') {
    if (lvl.onEsc) lvl.onEsc(s, g, st.focus);
    else g.say('Esc does nothing on this page.');
  }
  if (lvl.drift && st.k % lvl.drift === 0 && st.focus && !st.won && !st.failed) {
    const list = stops(lvl, s), di = list.indexOf(st.focus);
    if (di >= 0 && list.length > 1) { st.focus = list[(di + 1) % list.length]; g.say('The page nudged your focus along.'); }
  }
  if (lvl.after && !st.won && !st.failed) lvl.after(s, st.k, g);
  fix();
  if (lvl.onFocus && st.focus !== prev) { lvl.onFocus(s, st.focus, g); fix(); }
  if (lvl.limit && st.k >= lvl.limit && !st.won && !st.failed) st.failed = lvl.limitMsg || 'Out of time.';
  return st;
}
function solve(lvl, maxDepth, wantPath) {
  const limit = maxDepth || 60;
  const start = newGame(lvl);
  const hash = (st) => JSON.stringify([st.s, st.focus, lvl.limit ? st.k : lvl.kmod ? st.k % lvl.kmod : 0]);
  const seen = new Set([hash(start)]);
  let layer = [{ st: start, path: '' }];
  for (let d = 1; d <= limit; d++) {
    const next = [];
    for (const node of layer) {
      for (const k of KEYS) {
        const n = step(lvl, node.st, k);
        if (n.won) return wantPath ? { d, path: node.path + k } : d;
        if (n.failed) continue;
        const h = hash(n);
        if (seen.has(h)) continue;
        seen.add(h);
        next.push({ st: n, path: wantPath ? node.path + k : '' });
      }
    }
    if (!next.length) return null;
    layer = next;
  }
  return null;
}

const L = [];
const say = (m) => (s, g) => g.say(m);
const bad = (m) => (s, g) => g.fail(m);

/* 1 */ L.push({

  init: () => ({ agree: false }),
  els: {
    home: { kind: 'link', label: 'Home', act: (s, g) => g.say('You are already home.') },
    pricing: { kind: 'link', label: 'Pricing', act: (s, g) => g.say('Prices are free. You stay here.') },
    agree: { kind: 'check', label: 'I accept the terms', val: (s) => s.agree, act: (s) => { s.agree = !s.agree; } },
    sub: { kind: 'button', cls: 'primary', label: 'Subscribe', disabled: (s) => !s.agree, act: (s, g) => g.win() },
    later: { kind: 'link', label: 'Remind me later', act: (s, g) => g.say('We will remind you. Eventually.') }
  },
  order: () => ['home', 'pricing', 'agree', 'sub', 'later'],
  sections: [
    { cls: 'nav', items: ['home', 'pricing'] },
    { cls: 'main', heading: 'Before you join', text: 'Read the terms, or at least agree to them.', items: ['agree', 'sub', 'later'] }
  ]

/* 3 */ L.push({
  name: 'Checkout', url: 'shopnorth.example/checkout',
  goal: 'Place the order.',
  hint: 'The tab order here does not match the layout. Watch where the ring lands before you press Enter.',
  init: () => ({ addr: false }),
  els: {
    back: { kind: 'link', label: 'Back to cart', act: (s, g) => g.say('Your cart is still here.') },
    help: { kind: 'link', label: 'Help', act: (s, g) => g.say('Help is busy right now.') },
    promo: { kind: 'link', label: 'Add a promo code', act: (s, g) => g.say('No codes work today.') },
    addr: { kind: 'check', label: 'Use my saved address', val: (s) => s.addr, act: (s) => { s.addr = !s.addr; } },
    place: { kind: 'button', cls: 'primary', label: 'Place order', disabled: (s) => !s.addr, act: (s, g) => g.win() },
    clear: { kind: 'button', cls: 'danger', label: 'Empty cart', act: (s, g) => g.fail('You emptied the cart. Everything is gone.') }
  },
  order: () => ['clear', 'help', 'addr', 'back', 'place', 'promo'],

};
const lcm = (a, b) => { let x = a, y = b; while (y) { const t = x % y; x = y; y = t; } return (a / x) * b; };
function withPopups(b, o) {
  return Object.assign({}, b, o, {
    esc: true, kmod: lcm(b.kmod || 1, o.every),
    init: () => Object.assign(b.init(), { pop: false }),
    els: Object.assign({}, b.els, POP_ELS),
    order: (s) => b.order(s).concat(['pa', 'pb']),
    trap: (s) => (s.pop ? ['pa', 'pb'] : (b.trap ? b.trap(s) : null)),
    onEsc: (s, g, id) => { if (s.pop) { s.pop = false; g.focus(null); g.say('Popup gone.'); } else if (b.onEsc) b.onEsc(s, g, id); else g.say('Nothing to close.'); },
    after: (s, k, g) => { if (b.after) b.after(s, k, g); if (k % o.every === 0 && !s.pop) { s.pop = true; g.focus(null); g.say('A popup jumped in and took your focus.'); } },
    sections: b.sections.concat([{ cls: 'modal', show: (s) => s.pop, heading: 'Wait! Special offer…', text: 'Only for the next few seconds.', items: ['pa', 'pb'] }])
  });
}

  els.skip = { kind: 'button', cls: 'danger', label: c.skip, act: bad(c.skipMsg) };
  els.ver = { kind: 'button', cls: 'primary', label: 'Verify', act: (s, g) => { if (s.sel.slice().sort((a, b) => a - b).join() === want) g.win(); else g.fail('Wrong tiles. Try again.'); } };
  return {
    name: c.name, url: c.url, goal: 'Tick every tile that says ' + c.target + ', then press Verify.', hint: c.hint, trick: c.trick,
    init: () => ({ sel: [] }), groups: { grid: ids }, els, order: () => ['home', { group: 'grid' }, 'skip', 'ver'],
    sections: [{ cls: 'nav', items: ['home'] }, { cls: 'main', heading: c.heading, text: c.text, items: ids.concat(['skip', 'ver']) }]
  };
}

function mkMenu(c) {
  const els = { home: HOME, body: { kind: 'link', label: 'Document', act: say('A very empty document.') } };
  const bar = c.menus.map((m, k) => 'mb' + k), items = c.menus.map((m, k) => m.items.map((_, j) => 'mi' + k + '_' + j));
  let goal = '';
  c.menus.forEach((m, k) => {
    els['mb' + k] = { kind: 'button', label: m.label, val: (s) => s.open === k, act: (s, g) => { s.open = k; g.focus('mi' + k + '_0'); } };
    m.items.forEach((it, j) => {
      if (it[1] === 'win') goal = 'Open the ' + m.label + ' menu and choose ' + it[0] + '.';
      els['mi' + k + '_' + j] = { kind: 'button', label: it[0], hidden: (s) => s.open !== k, act: it[1] === 'win' ? (s, g) => g.win() : it[1] === 'fail' ? bad(it[2]) : say(it[2] || 'Nothing happened. Politely.') };
    });
  });
  const groups = { bar }; c.menus.forEach((m, k) => { groups['sub' + k] = items[k]; });
  return {
    name: c.name, url: c.url, goal, hint: c.hint, trick: c.trick,
    esc: true, init: () => ({ open: -1 }), groups, els, order: () => ['home', { group: 'bar' }, 'body'],
    trap: (s) => (s.open >= 0 ? items[s.open] : null),
    onEsc: (s, g) => { if (s.open >= 0) { const k = s.open; s.open = -1; g.focus('mb' + k); } else g.say('Nothing to close.'); },
    sections: [{ cls: 'nav', items: ['home'].concat(bar) }, { cls: 'drop', show: (s) => s.open >= 0, items: (s) => (s.open >= 0 ? items[s.open] : []) }, { cls: 'main', heading: c.heading, items: ['body'] }]
  };
}

function mkFeed(c) {
  const size = c.size || 3, els = { home: HOME }, ids = c.posts.map((_, i) => 'p' + i);
  c.posts.forEach((p, i) => { els['p' + i] = { kind: i === c.target ? 'link' : 'button', label: i === c.target ? c.subLabel : 'Like: ' + p, hidden: (s) => s.n <= i, act: i === c.target ? (s, g) => g.win() : say('Liked. Nobody noticed.') }; });
  els.more = { kind: 'button', label: 'Load more', hidden: (s) => s.n >= c.posts.length, act: (s, g) => { s.n += size; g.focus('p' + (s.n - size)); g.say(size + ' new posts loaded.'); } };
  return {

    init: () => ({ n: size }), els, order: () => ['home'].concat(ids, ['more']),
    sections: [{ cls: 'nav', items: ['home'] }, { cls: 'main', heading: c.heading, items: ids.concat(['more']) }]
  };
}

function mkWizard(c) {
  const els = { home: HOME }, stepIds = [], init = [], tgt = [];
  let n = 0;
  c.steps.forEach((st, k) => {
    stepIds[k] = [];
    st.items.forEach((it) => { const i = n++; init.push(it[1]); tgt.push(it[2]); els['w' + i] = { kind: 'toggle', label: it[0], hidden: (s) => s.step !== k, val: (s) => s.v[i], act: (s) => { s.v[i] = !s.v[i]; } }; stepIds[k].push(i); });
    const ok = (s) => stepIds[k].every((i) => s.v[i] === tgt[i]);
    const last = k === c.steps.length - 1;
    els['nx' + k] = { kind: 'button', cls: 'primary', label: last ? c.sub : 'Next', hidden: (s) => s.step !== k, disabled: (s) => !ok(s), act: last ? (s, g) => g.win() : (s, g) => { s.step = k + 1; g.focus(null); g.say('Step ' + (k + 2) + '. Focus reset to the top.'); } };
    els['bk' + k] = { kind: 'button', label: 'Back', hidden: (s) => s.step !== k || k === 0, act: (s, g) => { s.step = k - 1; g.focus(null); } };
    els['cx' + k] = { kind: 'button', cls: 'danger', label: st.decoy[0], hidden: (s) => s.step !== k, act: bad(st.decoy[1]) };
  });
  const list = (k) => stepIds[k].map((i) => 'w' + i).concat(['cx' + k, 'bk' + k, 'nx' + k]);
  return {
    name: c.name, url: c.url, goal: c.goal, hint: c.hint, trick: c.trick,
    init: () => ({ step: 0, v: init.slice() }), els, order: (s) => ['home'].concat(list(s.step)),
    sections: [{ cls: 'nav', items: ['home'] }].concat(c.steps.map((st, k) => ({ cls: 'main', show: (s) => s.step === k, heading: st.heading, text: st.text, items: list(k) })))
  };
}

  let h = '';
  for (let i = a; i <= b; i++) {
    const n = stars[i] || 0, locked = i > max;
    h += '<button class="lcard" type="button" data-i="' + i + '"' + (locked ? ' disabled' : '') + ' style="--c:' + c.bar + '">' +
      '<span class="band"><span class="ln">' + (i + 1) + '</span><span class="lr">PAR ' + PARS[i] + '</span></span>' +
      '<span class="body"><span class="lt">' + L[i].name + '</span><span class="ls">' + (locked ? 'Locked' : '\u2605'.repeat(n) + '\u2606'.repeat(3 - n)) + '</span></span></button>';
  }
  $('levelGrid').innerHTML = h;
}
function showWorlds() {
  mode = 'menu'; veil.hidden = true; renderWorlds(); setScreen('worlds');
  const cur = document.querySelector('#worldGrid .wcard.cur');
  if (cur && stars.some((x) => x)) window.scrollTo(0, Math.max(0, cur.getBoundingClientRect().top + window.scrollY - 150));
}
function showLevels(w) { mode = 'menu'; veil.hidden = true; renderLevels(w); setScreen('levels'); }
function renderMeter() {
  const m = $('meter');
  if (par == null) { m.hidden = true; return; }
  m.hidden = false;
  const max = par + 4;
  $('mFill').style.width = Math.min(100, (presses / max) * 100) + '%';
  $('mMark').style.left = 'calc(' + ((par / max) * 100) + '% - 1px)';
  m.className = 'meter ' + (presses <= par ? 'ok' : presses <= par + 3 ? 'meh' : 'bad');
}
function renderHud() {
  $('lname').innerHTML = 'World ' + (worldOf(li) + 1) + ' &middot; ' + 'Level ' + (li + 1) + ' of ' + L.length + ' &middot; <b>' + lvl.name + '</b>';
  $('mPress').textContent = presses;
  $('mPar').textContent = par == null ? '-' : par;
  $('url').textContent = 'https://' + lvl.url;
  $('goal').textContent = lvl.goal;
  $('hint').textContent = lvl.hint;
  $('trickRow').hidden = !lvl.trick;
  $('trick').textContent = lvl.trick || '';
  $('limWrap').hidden = !lvl.limit;
  if (lvl.limit) $('mLim').textContent = Math.max(0, lvl.limit - st.k);
  const kx = $('keyX');
  kx.hidden = !lvl.esc;
  document.querySelectorAll('.key').forEach((b) => b.classList.toggle('broken', !!(lvl.dead && lvl.dead.includes(b.dataset.k))));
  kx.classList.toggle('new', li === 11 && trail.indexOf('X') < 0);
  $('sFocus').textContent = describeFocus();
  $('sMsg').textContent = st.msg || '';
  $('trail').innerHTML = trail.length ? 'Keys: ' + trail.slice(-14).map((k) => '<span class="kc">' + KEYLABEL[k] + '</span>').join('') : 'Keys you press show up here.';
  renderMeter();
}
function renderAll() {
  renderPage();
  renderChips();
  renderHud();
  requestAnimationFrame(placeRing);
}
function showVeil(kind, title, text, sub, btn, starN) {
  veil.className = 'veil ' + kind;
  $('vTitle').textContent = title;
  $('vText').textContent = text;
  $('vSub').textContent = sub || '';
  const sEl = $('vStars');
  if (starN) {
    sEl.hidden = false;
    sEl.innerHTML = [0, 1, 2].map((i) => '<span style="--i:' + i + '" class="' + (i < starN ? '' : 'off') + '">★</span>').join('');
  } else { sEl.hidden = true; sEl.innerHTML = ''; }
  $('vBtn').textContent = btn;
  veil.hidden = false;
}
function confetti() {
  if (reduce) return;
  const box = $('confetti');
  const cols = ['#ff3d8b', '#2fd9a6', '#4ab8ff', '#ffd23f', '#7b5cff', '#ff9a4d'];
  let h = '';
  for (let i = 0; i < 46; i++) {
    const w = 7 + Math.random() * 7;
    h += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;width:' + w.toFixed(1) + 'px;height:' + (w * 1.5).toFixed(1) + 'px;background:' + cols[i % cols.length] + ';animation-delay:' + (Math.random() * 0.4).toFixed(2) + 's;animation-duration:' + (1.5 + Math.random() * 1.2).toFixed(2) + 's;--r:' + Math.floor(Math.random() * 720 - 360) + 'deg"></i>';
  }
  box.innerHTML = h;
  setTimeout(() => { box.innerHTML = ''; }, 3200);
}
function shake() {
  if (reduce) return;
  browser.classList.remove('shake');
  void browser.offsetWidth;
  browser.classList.add('shake');
}
function flashKey(k) {
  const b = document.querySelector('.key[data-k="' + k + '"]');
  if (!b) return;
  b.classList.add('hit');
  setTimeout(() => b.classList.remove('hit'), 130);
}
function applyTheme(i) {
  const c = LV[i % LV.length];
  browser.style.setProperty('--lv-bar', c.bar);
  browser.style.setProperty('--lv-tint-l', c.tint);
}
function prepare(i) {
  li = i; lvl = L[i]; st = newGame(lvl); par = PARS[i]; presses = 0; trail = [];
  lastPos = null; lastFocusId = null;
  applyTheme(i);
  $('confetti').innerHTML = '';
  renderAll();
}
function startLevel(i) { setScreen('play'); prepare(i); mode = 'play'; veil.hidden = true; }
function retry() { st = newGame(lvl); presses = 0; trail = []; lastFocusId = null; mode = 'play'; veil.hidden = true; renderAll(); }

function press(k) {
  const before = st;
  st = step(lvl, st, k);
  presses += 1;
  trail.push(k);
  renderAll();
  const focusChanged = before.focus !== st.focus;
  const sChanged = JSON.stringify(before.s) !== JSON.stringify(st.s);
  if (st.won) {
    mode = 'won';
    const n = par != null && presses <= par ? 3 : par != null && presses <= par + 3 ? 2 : 1;
    stars[li] = Math.max(stars[li] || 0, n);
    saveStars();
    bestP[li] = Math.min(bestP[li] || Infinity, presses);
    saveBest();
    renderChips();
    sfx.win();
    confetti();
    const endW = li < L.length - 1 && worldOf(li + 1) !== worldOf(li);
    const sub = (endW ? 'World complete! ' + WORLDS[worldOf(li + 1)].n + ' is open: ' + WORLDS[worldOf(li + 1)].t + '. ' : '') + (n === 3 ? 'A perfect hop.' : n === 2 ? 'So close. Fewer key presses means more stars.' : 'You made it. Can you find a shorter route?');
    showVeil('good', WINS[li % WINS.length], presses + ' key presses. Par is ' + (par == null ? 'unknown' : par) + '.', sub, li >= L.length - 1 ? 'See results' : endW ? 'Back to worlds' : 'Next level', n);
  } else if (st.failed) {
    mode = 'failed';
    sfx.fail();
    shake();
    showVeil('bad', OOPS[(li + presses) % OOPS.length], st.failed, 'Fresh start: the count resets when you try again.', 'Try again');
  } else if (k === 'E' || k === 'P' || k === 'X') {
    bumpRing();
    if (focusChanged || (k === 'X' && sChanged)) sfx.hop();
    else if (sChanged) sfx.tick(!!(st.focus && lvl.els[st.focus].val ? lvl.els[st.focus].val(st.s) : true));
    else sfx.nope();
  } else if (lvl.kmod && st.k % lvl.kmod === 0 && st.focus) {
    sfx.boing();
  } else if (focusChanged) {
    sfx.move(stops(lvl, st.s).indexOf(st.focus));
  } else {
    sfx.nope();
  }
}
function showFinished() {
  mode = 'finished';
  const have = L.every((_, i) => bestP[i]);
  const total = bestP.reduce((x, y) => x + (y || 0), 0);
  const parTotal = PARS.reduce((x, y) => x + (y || 0), 0);
  const starTotal = stars.reduce((x, y) => x + (y || 0), 0);
  sfx.win();
  confetti();
  showVeil('good', 'You did it!', (have ? 'Your best runs add up to ' + total + ' key presses across ' + L.length + ' pages. ' : 'You cleared all ' + L.length + ' pages. ') + 'Par for all of them is ' + parTotal + '.', starTotal + ' of ' + L.length * 3 + ' stars. Replay any level to collect more.', 'Back to worlds', 0);
}
function advance() {
  if (mode === 'won') { if (li >= L.length - 1) showFinished(); else if (worldOf(li + 1) !== worldOf(li)) showWorlds(); else startLevel(li + 1); }
  else if (mode === 'failed') retry();
  else if (mode === 'finished') showWorlds();
}
function handleKey(k) {
  if (screen !== 'play') return;
  flashKey(k);
  if (mode === 'play') press(k);
  else if (k === 'E' || k === 'P') advance();
}

const KEYMAP = { Tab: null, Enter: 'E', ' ': 'P', ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'L', ArrowDown: 'R', Escape: 'X' };
window.addEventListener('keydown', (e) => {
  if (screen !== 'play') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!(e.key in KEYMAP)) return;
  e.preventDefault();
  if (e.repeat) return;
  handleKey(e.key === 'Tab' ? (e.shiftKey ? 'S' : 'T') : KEYMAP[e.key]);
});
window.addEventListener('keyup', (e) => { if (screen === 'play' && (e.key === ' ' || e.key === 'Enter')) e.preventDefault(); });
window.addEventListener('resize', placeRing);

$('keys').addEventListener('click', (e) => {
  const b = e.target.closest('.key');
  if (b) handleKey(b.dataset.k);
});
$('keys').addEventListener('mousedown', (e) => e.preventDefault());
$('vBtn').addEventListener('click', (e) => { e.currentTarget.blur(); advance(); });
$('worldGrid').addEventListener('click', (e) => { const b = e.target.closest('.wcard'); if (b && !b.disabled) showLevels(parseInt(b.dataset.w, 10)); });
$('levelGrid').addEventListener('click', (e) => { const b = e.target.closest('.lcard'); if (b && !b.disabled) startLevel(parseInt(b.dataset.i, 10)); });
$('backWorlds').addEventListener('click', showWorlds);
$('backLevels').addEventListener('click', () => { document.activeElement && document.activeElement.blur(); showLevels(worldOf(li)); });
$('backLevels').addEventListener('mousedown', (e) => e.preventDefault());
$('contBtn').addEventListener('click', () => { const done = L.every((_, i) => stars[i]); startLevel(done ? 0 : unlocked()); });
themeBtn.addEventListener('mousedown', (e) => e.preventDefault());
themeBtn.addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  rootEl.setAttribute('data-theme', next);
  try { localStorage.setItem('focusring-theme', next); } catch (e) {}
  renderTheme();
  tone(next === 'dark' ? 330 : 660, 0.18, 'sine', 0.07, 0, next === 'dark' ? 220 : 990);
});
$('mute').addEventListener('mousedown', (e) => e.preventDefault());
$('mute').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('focusring-muted', muted ? '1' : '0'); } catch (e) {}
  renderMute();
  if (!muted) sfx.hop();
});

renderMute();
renderTheme();
veil.hidden = true;
mode = 'menu';
showWorlds();
</script>
</body>
</html>
